name: 构建 Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 解码签名密钥
        env:
          KS_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          KS_STORE_PW: ${{ secrets.APK_STORE_PASSWORD }}
          KS_KEY_PW: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          echo "$KS_BASE64" | base64 -d > android/release.keystore
          printf 'storeFile=%s/android/release.keystore\nstorePassword=%s\nkeyAlias=skydaily\nkeyPassword=%s\n' \
            "$GITHUB_WORKSPACE" "$KS_STORE_PW" "$KS_KEY_PW" > android/keystore.properties
          test -s android/release.keystore && echo "keystore OK $(wc -c < android/release.keystore) bytes"

      - name: 构建 APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: sky-daily-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
